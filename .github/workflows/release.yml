# يبني نسخة ويندوز (مجلّد مضغوط + مثبِّت) ويرفعها في صفحة الإصدارات.
#   إصدارٌ جديد:  git tag v0.9.4 && git push origin v0.9.4
#   إصدارٌ تجريبيّ: git tag v0.9.4-beta1 && git push origin v0.9.4-beta1
#   من المتصفّح: Actions ← Release ← Run workflow، واكتب الوسم (v0.9.4-beta1) للنشر، أو اتركه فارغًا لتجربة البناء بلا نشر
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "لنشر إصدار من المتصفّح اكتب الوسم (مثل v0.9.3-beta1). اتركه فارغًا لتجربة البناء بلا نشر."
        required: false
        default: ""

permissions:
  contents: write

# طرفيّة ويندوز تستعمل cp1252 فتنهار طباعة العربيّة في الفحص الذاتيّ
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: رقم الإصدار
        id: ver
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          V=$(python -c "import re;print(re.search(r'VERSION\s*=\s*\"([^\"]+)\"',open('app/common.py',encoding='utf-8').read()).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # الوسم v0.9.3 إصدار عادي، وv0.9.3-beta1 (أي لاحقة بعد شرطة) إصدار تجريبي
          if [ -n "$TAG" ]; then
            case "$TAG" in
              "v$V"|"v$V"-*) ;;
              *) echo "::error::الوسم $TAG لا يطابق VERSION في app/common.py ($V)"; exit 1 ;;
            esac
          fi
          grep -q "#define AppVer \"$V\"" installer/bughya.iss || { echo "::error::AppVer في bughya.iss لا يطابق $V"; exit 1; }
          grep -q "'FileVersion', '$V'" assets/version.txt || { echo "::error::assets/version.txt لا يطابق $V"; exit 1; }

      - name: تجهيز البيئة والفحص الذاتي
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -q -r requirements.txt
          .venv\Scripts\python.exe selftest.py

      - name: بناء البرنامج
        shell: cmd
        run: build_exe.bat

      - name: تغليف zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Bughya -DestinationPath "dist\Bughya-windows-${{ steps.ver.outputs.version }}.zip"

      - name: بناء المثبِّت
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\bughya.iss

      - name: مجموع التحقق
        shell: pwsh
        run: |
          Get-ChildItem dist\*.zip, dist\*Setup*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bughya-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/Bughya-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: نشر الإصدار
        if: steps.ver.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" $PRE --target "$GITHUB_SHA" \
            --title "بُغية ${{ steps.ver.outputs.version }}" \
            --generate-notes \
            dist/*.zip dist/Bughya-Setup-*.exe dist/SHA256SUMS.txt
